{% extends 'base.html' %}
{% block content %}
<h3>Send Status</h3>
<p>
  {% if sending %}
    <span class="badge bg-primary">Sending in progress</span>
  {% else %}
    <span class="badge bg-secondary">Idle</span>
  {% endif %}
</p>

<pre id="logs" class="bg-dark text-light p-3 rounded" style="min-height: 320px; max-height: 60vh; overflow: auto;">{% if logs %}{{ logs|join('\n') }}{% else %}No logs yet.{% endif %}</pre>

<div class="mt-3">
  <a href="{{ url_for('index') }}" class="btn btn-secondary">Back</a>
</div>

<script>
function refreshLogs() {
  fetch('{{ url_for("api_logs") }}')
    .then(function(res) { return res.json(); })
    .then(function(data) {
      var el = document.getElementById('logs');
      el.textContent = (data.lines && data.lines.length) ? data.lines.join('\n') : 'No logs yet.';
      el.scrollTop = el.scrollHeight;
    })
    .catch(function() {});
}
setInterval(refreshLogs, 2000);
</script>
{% endblock %}
